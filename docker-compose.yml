version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: snack_db
      POSTGRES_USER: snack_user
      POSTGRES_PASSWORD: snack_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snack_user -d snack_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://snack_user:snack_password@db:5432/snack_db
      SECRET_KEY: your-super-secret-jwt-key-change-in-production-please
      DEBUG: "true"
      ALLOWED_ORIGINS: '["http://localhost:3000", "http://localhost:8080", "http://localhost:8000"]'
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        sleep 5 &&
        /root/.local/bin/uv run alembic upgrade head &&
        /root/.local/bin/uv run python -m app.main
      "

volumes:
  postgres_data: