[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "snack-chat-service"
version = "1.0.0"
description = "A self-hosted chat service with end-to-end encryption"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",
    "websockets==12.0",
    "sqlalchemy==2.0.44",
    "asyncpg==0.30.0",
    "alembic==1.12.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "pydantic>=2.12.0,<3",
    "pydantic-settings==2.1.0",
    "ruff>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "httpx==0.25.2",
    "psycopg2-binary==2.9.11",
    "black==23.11.0",
    "isort==5.12.0",
    "ruff==0.14.0",
    "mypy==1.7.1",
]

[project.urls]
Homepage = "https://github.com/yourusername/snack-chat-service"
Repository = "https://github.com/yourusername/snack-chat-service.git"
Issues = "https://github.com/yourusername/snack-chat-service/issues"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*", "alembic.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
exclude = [
    "./.venv",
    "./.eggs",
    "./build",
    "./dist",
    "./.mypy_cache",
]
extend-select = ["I", "E", "F", "W", "C", "N"]
